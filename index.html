<!doctype html>
<html lang="en">
  <head>
    <script>
      // Workaround for "Cannot set property fetch of #<Window> which has only a getter"
      // This allows AI Studio or other scripts to do `window.fetch = newFetch` without crashing.
      if (typeof window !== 'undefined' && window.fetch) {
        const originalFetch = window.fetch;
        try {
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() { return this._fetch || originalFetch; },
            set: function(val) { this._fetch = val; }
          });
        } catch (e) {
          console.error('Failed to redefine fetch:', e);
        }
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
    <meta name="description" content="An application built with Google AI Studio." />
    <meta property="og:title" content="My Google AI Studio App" />
    <meta property="og:description" content="An application built with Google AI Studio." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
